name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_HOME: /tmp/cat-corepack
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Quality (check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Bootstrap integrity-pinned pnpm for dependency caching
        run: node scripts/package-manager-pin.ts

      - name: Setup exact Node.js patch
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Activate integrity-pinned pnpm for the exact Node runtime
        run: node scripts/package-manager-pin.ts

      - name: Install dependencies
        run: pnpm ci:install

      - name: Run repository quality contract
        env:
          TURBO_TEAM: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && vars.TURBO_TEAM || '' }}
          TURBO_TOKEN: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && secrets.TURBO_TOKEN || '' }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY || '' }}
        run: pnpm check

  check-all:
    name: Full Graph (check:all)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Bootstrap integrity-pinned pnpm for dependency caching
        run: node scripts/package-manager-pin.ts

      - name: Setup exact Node.js patch
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Activate integrity-pinned pnpm for the exact Node runtime
        run: node scripts/package-manager-pin.ts

      - name: Install dependencies
        run: pnpm ci:install

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore trusted Buildx cache
        id: buildx-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .cache/buildx
          key: buildx-${{ runner.os }}-main-${{ github.sha }}
          restore-keys: |
            buildx-${{ runner.os }}-main-

      - name: Install workspace Playwright browsers and system dependencies
        run: pnpm test:e2e:install-browsers

      - name: Verify the pinned official Node image manifest
        run: pnpm container:verify-base-image

      - name: Run complete repository contract and export validated images
        env:
          CAT_CHECK_ALL_EXPORT_IMAGES_DIR: validated-images
          CAT_CHECK_ALL_PROJECT_NAME: cat-validated-${{ github.sha }}
          TURBO_TEAM: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && vars.TURBO_TEAM || '' }}
          TURBO_TOKEN: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && secrets.TURBO_TOKEN || '' }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY || '' }}
          CAT_BUILDX_CACHE_SOURCE: .cache/buildx
          CAT_BUILDX_CACHE_OUTPUT: .cache/buildx-next
        run: pnpm check:all:ci

      - name: Upload failed E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.sha }}
          path: |
            .tmp/e2e
            !.tmp/e2e/**/playwright/.auth/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Buildx cache from trusted builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/buildx
          key: buildx-${{ runner.os }}-main-${{ github.sha }}

      - name: Upload validated container images
        uses: actions/upload-artifact@v4
        with:
          name: validated-images-${{ github.sha }}
          path: validated-images
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  release-images:
    name: Publish validated container images
    needs:
      - check
      - check-all
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Bootstrap integrity-pinned pnpm for dependency caching
        run: node scripts/package-manager-pin.ts

      - name: Setup exact Node.js patch
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Activate integrity-pinned pnpm for the exact Node runtime
        run: node scripts/package-manager-pin.ts

      - name: Download validated container images
        uses: actions/download-artifact@v4
        with:
          name: validated-images-${{ github.sha }}
          path: validated-images

      - name: Verify and load validated container images
        run: pnpm container:verify-artifacts

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish without rebuilding
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: pnpm release:images
