name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_HOME: /tmp/cat-corepack
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Quality (check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Bootstrap integrity-pinned pnpm for dependency caching
        run: node scripts/package-manager-pin.ts

      - name: Setup exact Node.js patch
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Activate integrity-pinned pnpm for the exact Node runtime
        run: node scripts/package-manager-pin.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}-${{ github.ref_name }}-${{ github.job }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}-main-

      - name: Run repository quality contract
        run: pnpm check

      - name: Persist Turbo cache for trusted runs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache/save@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}-${{ github.ref_name }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

  check-all:
    name: Full Graph (check:all)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Bootstrap integrity-pinned pnpm for dependency caching
        run: node scripts/package-manager-pin.ts

      - name: Setup exact Node.js patch
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Activate integrity-pinned pnpm for the exact Node runtime
        run: node scripts/package-manager-pin.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install workspace Playwright browsers and system dependencies
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Verify the pinned official Node image manifest
        run: |
          image=$(sed -n 's/^FROM \(node:[^ ]*\) AS context-contract$/\1/p' apps/app/Dockerfile)
          test -n "$image"
          docker buildx imagetools inspect "$image"

      - name: Restore Turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}-${{ github.ref_name }}-${{ github.job }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}-main-

      - name: Run complete repository contract and export validated images
        env:
          CAT_CHECK_ALL_EXPORT_IMAGES_DIR: validated-images
          CAT_CHECK_ALL_PROJECT_NAME: cat-validated-${{ github.sha }}
        run: |
          mkdir -p validated-images
          pnpm check:all
          cd validated-images
          sha256sum manifest.json standalone.tar runtime.tar > SHA256SUMS

      - name: Upload validated container images
        uses: actions/upload-artifact@v4
        with:
          name: validated-images-${{ github.sha }}
          path: validated-images
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Persist Turbo cache for trusted runs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache/save@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}-${{ github.ref_name }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

  release-images:
    name: Publish validated container images
    needs:
      - check
      - check-all
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Bootstrap integrity-pinned pnpm for dependency caching
        run: node scripts/package-manager-pin.ts

      - name: Setup exact Node.js patch
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Activate integrity-pinned pnpm for the exact Node runtime
        run: node scripts/package-manager-pin.ts

      - name: Download validated container images
        uses: actions/download-artifact@v4
        with:
          name: validated-images-${{ github.sha }}
          path: validated-images

      - name: Verify and load validated container images
        run: |
          cd validated-images
          sha256sum --check SHA256SUMS
          docker image load --input standalone.tar
          docker image load --input runtime.tar
          for target in standalone runtime; do
            image="$(node -e "const manifest = JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8')); process.stdout.write(manifest.images['$target'].imageId)")"
            version="$(node -e "const manifest = JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8')); process.stdout.write(manifest.images['$target'].identity.versionLabel)")"
            command="$(node -e "const manifest = JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8')); process.stdout.write(manifest.images['$target'].identity.command)")"
            description="$(node -e "const manifest = JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8')); process.stdout.write(manifest.images['$target'].identity.description)")"
            test "$(docker image inspect --format '{{.Id}}' "$image")" = "$image"
            test "$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.version\" }}' "$image")" = "$version"
            test "$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.description\" }}' "$image")" = "$description"
            test "$(docker image inspect --format '{{ index .Config.Cmd 0 }}' "$image")" = "$command"
          done

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish without rebuilding
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          version=$(node -p "require('./apps/app/package.json').version")
          for target in standalone runtime; do
            source="$(node -e "const manifest = JSON.parse(require('node:fs').readFileSync('validated-images/manifest.json', 'utf8')); process.stdout.write(manifest.images['$target'].imageId)")"
            while IFS= read -r tag; do
              docker image tag "$source" "$tag"
              docker image push "$tag"
            done < <(node scripts/release-image-tags.ts "$IMAGE" "$version" "$GITHUB_SHA" "$target")
          done
