version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    open-pull-requests-limit: 20
    groups:
      workspace-toolchain:
        patterns:
          - turbo
          - typescript
          - "@typescript/*"
          - oxlint
          - oxfmt
          - pnpm
      frontend:
        patterns:
          - vue
          - "@vue/*"
          - "@vueuse/*"
      backend:
        patterns:
          - hono
          - "@hono/*"
          - "drizzle-*"
      testing:
        patterns:
          - vitest
          - "@vitest/*"
          - playwright
          - "@playwright/*"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  # One multi-directory group keeps both official Node image references together.
  # The CI config contract requires the same exact patch in package.json engines.
  - package-ecosystem: docker
    directories:
      - /.devcontainer
      - /apps/app
    schedule:
      interval: weekly
    groups:
      node-runtime:
        group-by: dependency-name
        patterns:
          - node

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
