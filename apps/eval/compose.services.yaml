services:
  redis:
    image: redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep PONG
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    ports:
      - "6379:6379"

  postgresql:
    build:
      context: ../postgres-search-runtime
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: cat
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s

  ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11435:11434"
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c '</dev/tcp/localhost/11434'
      start_period: 30s
      interval: 15s
      retries: 5
      timeout: 5s

  spacy:
    image: cat-spacy-server:local
    build:
      context: ../spacy-server
    command: ["provision-and-serve"]
    environment:
      SPACY_MODELS_ROOT: /models
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    user: "10001:10001"
    volumes:
      - spacy-models:/models

volumes:
  ollama-data:
  spacy-models:
