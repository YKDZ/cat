name: cat-eval

services:
  postgresql:
    extends:
      file: ../app/compose.services.yaml
      service: postgresql
    environment:
      POSTGRES_DB: cat
      POSTGRES_PASSWORD: pass
      POSTGRES_USER: user
    ports:
      - "127.0.0.1:${CAT_EVAL_POSTGRES_HOST_PORT:-5432}:5432"
    restart: "no"
    security_opt:
      - no-new-privileges:true
    volumes:
      - eval-postgresql-data:/var/lib/postgresql

  redis:
    extends:
      file: ../app/compose.services.yaml
      service: redis
    image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - eval-redis
    environment:
      REDIS_PASSWORD: eval-redis
    ports:
      - "127.0.0.1:${CAT_EVAL_REDIS_HOST_PORT:-6379}:6379"
    restart: "no"
    security_opt:
      - no-new-privileges:true
    volumes:
      - eval-redis-data:/data

  ollama:
    image: ollama/ollama:0.16.1
    ports:
      - "127.0.0.1:${CAT_EVAL_OLLAMA_HOST_PORT:-11435}:11434"
    restart: "no"
    security_opt:
      - no-new-privileges:true
    volumes:
      - eval-ollama-data:/root/.ollama
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c '</dev/tcp/localhost/11434'
      interval: 15s
      retries: 5
      start_period: 30s
      timeout: 5s

  spacy:
    extends:
      file: ../app/compose.services.yaml
      service: spacy
    build: !reset null
    image: ${CAT_SPACY_IMAGE_ID:?CAT_SPACY_IMAGE_ID must be an immutable spaCy image ID}
    ports:
      - "127.0.0.1:${CAT_EVAL_SPACY_HOST_PORT:-8000}:8000"
    restart: "no"
    security_opt:
      - no-new-privileges:true
    volumes:
      - eval-spacy-models:/models

volumes:
  eval-ollama-data:
  eval-postgresql-data:
  eval-redis-data:
  eval-spacy-models:
