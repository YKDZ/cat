# Stable local/test service capabilities. Entry files own credentials, ports,
# persistence, and lifecycle policy through Compose extends.
services:
  postgresql:
    image: cat-postgres-search-runtime:local
    build:
      context: ../postgres-search-runtime
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER} && psql -d $${POSTGRES_DB} -U $${POSTGRES_USER} -v ON_ERROR_STOP=1 -f /usr/local/share/search-runtime/healthcheck/search-runtime.sql
      interval: 10s
      retries: 12
      start_period: 20s
      timeout: 5s

  redis:
    image: redis:8-alpine
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 10s
      retries: 12
      start_period: 10s
      timeout: 3s

  spacy:
    image: ${CAT_SPACY_IMAGE_ID:-cat-spacy-server:local}
    build:
      context: ../spacy-server
    command: ["provision-and-serve"]
    environment:
      SPACY_MODELS_ROOT: /models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()
      interval: 10s
      retries: 18
      start_period: 60s
      timeout: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    user: "10001:10001"
